[project]
name = "comfyui-production-nodes"
version = "1.0.0"
description = "Production nodes for ComfyUI: prompt sheets from CSV, a model-free quality gate, .cube LUT grading and provenance sidecars."
authors = [{ name = "The Jungle Fruit", email = "thejunglefruit@proton.me" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/thejunglefruit/comfyui-production-nodes"

[tool.comfy]
PublisherId = "thejunglefruit"
DisplayName = "Production Nodes"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
